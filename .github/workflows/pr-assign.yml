# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Manage PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

concurrency:
  group: pr-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    name: Auto-assign PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Auto-assign PR
        run: gh api --method POST "repos/$REPO/issues/$PR/assignees" -f "assignees[]=$ASSIGNEE"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ASSIGNEE: sergeyklay
